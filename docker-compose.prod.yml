services:
  api:
    image: ghcr.io/mariana-evangelista/projeto-quimera-pic-2024:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - web
      - internal

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - web

networks:
  web:
  internal:
    internal: true

volumes:
  mongo-data:
  caddy-data:
  caddy-config: